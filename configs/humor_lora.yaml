model:
  id: "Qwen/Qwen2.5-VL-3B-Instruct"
  quantization: "4bit"
  gradient_checkpointing: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"

dataset:
  train_path: "data/processed/training/memotion3_train.jsonl"
  val_path: "data/processed/training/memotion3_val.jsonl"
  test_path: "data/processed/training/memotion3_test.jsonl"
  max_seq_length: 512

training:
  output_dir: "models/qwen2.5-vl-3b-humor-lora"
  logs_dir: "results/humor_lora_training/logs"
  metrics_dir: "results/humor_lora_training/metrics"
  
  epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  optim: "paged_adamw_32bit"
  bf16: true
  fp16: false
  
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 50
  logging_steps: 10
  
  early_stopping_patience: 3
  seed: 42
